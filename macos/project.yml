name: Ade
options:
  bundleIdPrefix: com.ade
  deploymentTarget:
    macOS: '14.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    MARKETING_VERSION: '0.4.6'
    CURRENT_PROJECT_VERSION: 20
    CODE_SIGN_STYLE: Automatic
    CODE_SIGN_ENTITLEMENTS: Ade.entitlements
    ENABLE_APP_SANDBOX: YES
    ENABLE_HARDENED_RUNTIME: NO
    ENABLE_OUTGOING_NETWORK_CONNECTIONS: NO
    ENABLE_USER_SELECTED_FILES: readwrite
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_KEY_CFBundleDisplayName: Adê
    INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
    INFOPLIST_KEY_NSPrincipalClass: NSApplication
    COMBINE_HIDPI_IMAGES: YES
  configs:
    Release:
      ENABLE_HARDENED_RUNTIME: YES
      CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO
targets:
  Ade:
    type: application
    platform: macOS
    info:
      path: Ade-Info.plist
      properties:
        CFBundleIconFile: AppIcon.icns
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSHumanReadableCopyright: © 2026 Abzu Studio
    sources:
      - path: AppIcon.icns
        buildPhase: resources
      - path: Ade
        excludes: [Resources]
      - path: Ade/Resources
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ade.mac
        PRODUCT_NAME: Ade
  AdeUITests:
    type: bundle.ui-testing
    platform: macOS
    sources:
      - path: ../native-tests/UITests
    dependencies:
      - target: Ade
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ade.mac.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Ade
schemes:
  Ade:
    build:
      targets:
        Ade: all
    run:
      config: Debug
    test:
      targets:
        - AdeUITests
