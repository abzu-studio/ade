name: Native validation
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  native:
    runs-on: xcode-27
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.0.0.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
      - name: Verify exact local toolchain
        run: bash scripts/verify-toolchain.sh
      - name: Audit source tree
        run: python3 scripts/audit-source.py
      - name: Domain, persistence and PDF checks
        run: ./scripts/test-native.sh
      - name: Universal Release build
        run: >-
          xcodebuild -project macos/Ade.xcodeproj -scheme Ade
          -configuration Release -derivedDataPath build/ReleaseDerived
          CODE_SIGN_IDENTITY=- ARCHS='arm64 x86_64' ONLY_ACTIVE_ARCH=NO build
      - name: Verify Release contents and signing restrictions
        run: python3 scripts/package-mac.py verify build/ReleaseDerived/Build/Products/Release/Ade.app
      - name: Zip the universal macOS app
        run: |
          set -euo pipefail
          app=build/ReleaseDerived/Build/Products/Release/Ade.app
          version=$(defaults read "$PWD/$app/Contents/Info" CFBundleShortVersionString)
          build=$(defaults read "$PWD/$app/Contents/Info" CFBundleVersion)
          ditto --noqtn --norsrc "$app" "Adê.app"
          ditto -c -k --keepParent "Adê.app" "Ade-${version}-${build}-macos.zip"
          rm -rf "Adê.app"
      - uses: actions/upload-artifact@v4
        with:
          name: ade-macos-zip
          path: Ade-*-macos.zip
          if-no-files-found: error
          retention-days: 14
      - name: Capture the workspace window
        timeout-minutes: 8
        run: |
          set -euo pipefail
          xcodebuild -project macos/Ade.xcodeproj -scheme Ade \
            -configuration Debug -derivedDataPath build/CaptureDerived \
            -destination 'platform=macOS' \
            CODE_SIGN_IDENTITY=- ONLY_ACTIVE_ARCH=YES build
          app=build/CaptureDerived/Build/Products/Debug/Ade.app
          log="${RUNNER_TEMP}/ade-capture.log"
          ADE_UI_TEST_RUN=noborder ADE_CAPTURE_WINDOW="${RUNNER_TEMP}/no-border.png" \
            "$app/Contents/MacOS/Ade" > "$log" 2>&1
          src=$(sed -n 's/^ADE_CAPTURE_WROTE=//p' "$log" | tail -1)
          test -n "$src"
          cp "$src" no-border.png
          test -s no-border.png
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ade-no-border
          path: no-border.png
          if-no-files-found: warn
          retention-days: 5
