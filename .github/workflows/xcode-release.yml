name: Xcode DMG release
on:
  push:
    branches: [main]
    paths: ['macos/project.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: xcode-dmg-release
  cancel-in-progress: false
jobs:
  package:
    if: github.ref == 'refs/heads/main'
    runs-on: xcode-27
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.0.0.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
      - name: Verify exact local toolchain
        run: bash scripts/verify-toolchain.sh
      - name: Audit publication tree
        run: python3 scripts/audit-source.py
      - name: Verify rules, persistence, privacy defaults and PDF output
        run: ./scripts/test-native.sh
      - name: Build and verify universal DMG
        run: python3 scripts/package-mac.py preview
      - name: Archive corresponding source and provenance
        shell: bash
        run: |
          set -euo pipefail
          test -s dist/preview/Ade-0.4.8-22-unsigned.dmg
          git archive --format=zip --prefix=Ade-0.4.8/ -o dist/preview/Ade-0.4.8-source.zip "$GITHUB_SHA" \
            macos native-tests scripts/test-native.sh scripts/test-ui.sh scripts/package-mac.py scripts/audit-source.py \
            scripts/generate-opening-sound.py scripts/verify-toolchain.sh docs/BUILD-XCODE.md docs/ARCHITECTURE-XCODE.md \
            docs/RULES-XCODE.md docs/DISTRIBUTION.md docs/RELEASE-0.4.8.md \
            LICENSE PRIVACY.md THIRD_PARTY_NOTICES.md .gitignore
          printf 'Adê 0.4.8 (22)\nCommit: %s\nBuild: https://github.com/%s/actions/runs/%s\nSigning: ad hoc, not Apple notarized\n' \
            "$GITHUB_SHA" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" > dist/preview/BUILD.txt
          xcodebuild -version >> dist/preview/BUILD.txt
          xcrun swift --version >> dist/preview/BUILD.txt
          cp docs/RELEASE-0.4.8.md dist/preview/RELEASE.md
          cd dist/preview
          shasum -a 256 Ade-0.4.8-22-unsigned.dmg Ade-0.4.8-source.zip > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: xcode-release-048
          path: |
            dist/preview/Ade-0.4.8-22-unsigned.dmg
            dist/preview/Ade-0.4.8-source.zip
            dist/preview/SHA256SUMS.txt
            dist/preview/BUILD.txt
            dist/preview/RELEASE.md
          if-no-files-found: error
          retention-days: 7
  publish:
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: xcode-release-048
          path: release
      - name: Verify downloads and publish Adê 0.4.8
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          cd release
          sha256sum --check SHA256SUMS.txt
          # 0.4.8 may already be published from the release commit. Do not move that tag.
          if gh release view v0.4.8 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "v0.4.8 already exists; leaving the tag in place."
            exit 0
          fi
          gh release create v0.4.8 --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --draft --title 'Adê 0.4.8 — macOS · SwiftUI/Xcode' --notes-file RELEASE.md \
            Ade-0.4.8-22-unsigned.dmg Ade-0.4.8-source.zip SHA256SUMS.txt BUILD.txt
          release_id="$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq '.[] | select(.tag_name == "v0.4.8") | .id')"
          test -n "$release_id"
          gh api "repos/$GITHUB_REPOSITORY/releases/$release_id" > release.json
          python3 - <<'PY'
          import hashlib, json, os, pathlib
          r = json.load(open('release.json'))
          assert r['draft'] and r['target_commitish'] == os.environ['GITHUB_SHA']
          assets = {a['name']: a for a in r['assets']}
          expected = {'Ade-0.4.8-22-unsigned.dmg', 'Ade-0.4.8-source.zip', 'SHA256SUMS.txt', 'BUILD.txt'}
          assert set(assets) == expected
          for name in expected:
              payload = pathlib.Path(name).read_bytes()
              assert assets[name]['size'] == len(payload)
              assert assets[name]['digest'] == 'sha256:' + hashlib.sha256(payload).hexdigest()
          PY
          gh release edit v0.4.8 --repo "$GITHUB_REPOSITORY" --draft=false --prerelease=false --latest
          test "$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name)" = v0.4.8
